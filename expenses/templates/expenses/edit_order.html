<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل الطلب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h3 class="text-center text-primary mb-4">✏️ تعديل الطلب</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">اسم الطلب</label>
                <input type="text" name="item_name" class="form-control" value="{{ order.item_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">المبلغ</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ order.price }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">التاريخ</label>
                <input type="date" name="date_requested" class="form-control" value="{{ order.date_requested|date:'Y-m-d' }}" required>
            </div>
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" name="is_settled" id="is_settled" {% if order.is_settled %}checked{% endif %}>
                <label class="form-check-label" for="is_settled">
                    تم التسديد (تحديد كمدفوع)
                </label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold">حفظ التعديلات</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100 fw-bold">إلغاء والعودة</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
